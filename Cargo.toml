[package]
name = "microtak-server"
version = "0.1.0"
edition = "2021"
description = "MicroTAK server: a lightweight, mesh-federated TAK server for grid-down / island deployments"
license = "MIT"

[lib]
name = "microtak_server"
path = "src/lib.rs"

[[bin]]
name = "microtakd"
path = "src/main.rs"

[dependencies]
axum = "0.7"
hyper-util = { version = "0.1.20", default-features = false, features = ["server", "server-auto", "tokio", "service"] }
pem = "4"
quick-xml = { version = "0.36", features = ["serialize"] }
rcgen = { version = "0.14", features = ["x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
thiserror = "1"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "sync", "io-util", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "1.1.6"
tracing = "0.1"
tracing-subscriber = "0.3"
x509-parser = "0.18"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
