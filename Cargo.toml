[package]
name = "edgetak"
version = "0.1.0"
edition = "2021"
description = "EdgeTAK: a lightweight, mesh-federated TAK server for grid-down / island deployments"
license = "MIT"

[lib]
name = "edgetak"
path = "src/lib.rs"

[[bin]]
name = "edgetakd"
path = "src/main.rs"

[dependencies]
quick-xml = { version = "0.36", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "sync", "io-util", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
