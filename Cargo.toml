[package]
name = "microtak-server"
version = "0.14.0"
edition = "2024"
description = "MicroTAK server: a lightweight, mesh-federated TAK server for grid-down / island deployments"
license = "AGPL-3.0-or-later"

[lib]
name = "microtak_server"
path = "src/lib.rs"

[[bin]]
name = "microtakd"
path = "src/main.rs"

[dependencies]
argon2 = { version = "0.6", features = ["getrandom"] }
axum = { version = "0.7", features = ["multipart"] }
base64 = "0.22"
getrandom = "0.2"
hyper-util = { version = "0.1.20", default-features = false, features = ["server", "server-auto", "tokio", "service"] }
if-addrs = "0.15"
pem = "4"
socket2 = { version = "0.6", features = ["all"] }
quick-xml = { version = "0.41", features = ["serialize", "overlapped-lists"] }
rcgen = { version = "0.14", features = ["x509-parser", "aws_lc_rs"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }
ring = "0.17"
bytes = "1"
# TAK Protocol (streaming protobuf): the official .proto messages, as
# hand-written prost structs (no codegen).
prost = "0.14"
serde_urlencoded = "0.7"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
thiserror = "1"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "sync", "io-util", "time", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "1.1.6"
tracing = "0.1"
tracing-subscriber = "0.3"
x509-parser = "0.18"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
