# Default values for the microtak-server chart.

image:
  repository: ghcr.io/microtak/microtak-server
  # Defaults to .Chart.AppVersion when unset.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# MicroTAK is a single stateful "island" instance, not a horizontally
# scalable stateless service -- its CA, device registry, and mission store
# all live on the one attached volume. Do not scale this above 1; a second
# replica would either fight over the same volume (ReadWriteOnce) or, if
# each got its own volume, silently split into two different servers with
# two different CAs. Run additional independent MicroTAK islands as separate
# `helm install` releases instead.
replicaCount: 1

service:
  type: ClusterIP
  ports:
    enrollment: 8446
    martiApi: 8443
    plainTcp: 8087
    mtls: 8089

persistence:
  data:
    enabled: true
    size: 1Gi
    storageClassName: ""
    accessMode: ReadWriteOnce
    # Use an existing PVC instead of creating one.
    existingClaim: ""
  backup:
    # Off by default, matching config.backup.enabled below. If you turn on
    # config.backup.enabled without also enabling this, backups land on the
    # pod's writable container layer -- functional, but lost on pod
    # rescheduling, not a real backup. Turn both on together for anything
    # that matters.
    enabled: false
    size: 1Gi
    storageClassName: ""
    accessMode: ReadWriteOnce
    existingClaim: ""

# Rendered into a ConfigMap at /etc/microtak/microtak.toml -- see
# docs/TEST-PLAN.md §10 in the main repo for the full field reference.
# data_dir and backup_dir are fixed by this chart to the mounted volume
# paths (/var/lib/microtak-server/data, /var/lib/microtak-server/backup) and are not
# exposed here -- overriding them would point the app outside its
# persistent volumes.
config:
  bindHost: "0.0.0.0"
  caCommonName: "MicroTAK CA"
  serverCommonName: "microtak-server"
  certValidityDays: 365
  # Extra IPs/DNS names for the server certificate (e.g. the LoadBalancer
  # address or DNS name clients enroll against). Inside a pod, automatic
  # interface detection only sees the pod IP, so list external names here.
  serverNames: []
  # Reverse proxies / ingress controllers whose X-Forwarded-For is trusted
  # for rate limiting (IPs or CIDRs), e.g. the ingress controller's pod CIDR.
  trustedProxies: []
  # TCP proxies / load balancers whose PROXY protocol header is believed
  # (IPs or CIDRs), e.g. an ingress controller doing TLS passthrough to the
  # mTLS ports. Without it, everything behind such a proxy shares its address.
  proxyProtocolFrom: []
  # The plain-TCP CoT relay is unauthenticated cleartext -- off unless you
  # run a trusted local bridge that needs it.
  plainTcpEnabled: false
  # The admin device's Common Name; it enrolls once with the bootstrap token
  # written to the data volume (data/bootstrap-token) on first start.
  adminCommonName: "admin"
  # "auto" (locked from the start: invite token or password account needed)
  # or "open" (any new identity may enroll -- only on a trusted network).
  enrollmentMode: "auto"
  # Largest Data Sync upload (photos, data packages), in MB.
  maxUploadMb: 100
  # A device's SA must carry the clientUid its certificate was enrolled
  # for (the official validateClientUid; officially off).
  validateClientUid: true
  limits:
    maxConnections: 1024
    maxConnectionsPerIp: 64
    handshakeTimeoutSeconds: 10
    # Drop a connection whose sent data stays unacknowledged this long (a
    # client that vanished); 0 = the kernel's default (~15 min).
    tcpUserTimeoutSeconds: 60
    httpHeaderTimeoutSeconds: 10
  backup:
    enabled: false
    intervalSeconds: 3600
    # e.g. ["rsync", "-a", "{src}/", "user@host:/backups/microtak/"] -- the
    # image ships rsync and an ssh client for exactly this. An SSH private
    # key/known_hosts for this needs its own Secret volume mount, not
    # provided by this chart -- add one via `extraVolumes`/`extraVolumeMounts`
    # below if you need offsite shipping.
    offsiteCommand: []

# A publicly trusted certificate for the enrollment port (devices have no
# CA yet when they enroll), e.g. the Secret cert-manager writes for a
# Certificate. Mounted read-only; the server picks up renewals without a
# restart. Empty: a certificate from MicroTAK's own CA.
enrollmentCert:
  existingSecret: ""

# Prometheus metrics (/metrics, plain HTTP, no auth -- cluster-internal
# only; the port is added to the Service). See the README.
metrics:
  enabled: false
  port: 9101
  serviceMonitor:
    # Needs the Prometheus Operator CRDs (e.g. kube-prometheus-stack).
    enabled: false
    interval: 30s
    # Extra labels, e.g. the release label your Prometheus selects on.
    labels: {}

extraVolumes: []
extraVolumeMounts: []
extraEnv: []

resources: {}
# Example:
# resources:
#   requests:
#     cpu: 100m
#     memory: 64Mi
#   limits:
#     memory: 256Mi

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 10001

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
