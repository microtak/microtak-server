apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "microtak-server.fullname" . }}-config
  labels:
    {{- include "microtak-server.labels" . | nindent 4 }}
data:
  microtak.toml: |
    bind_host = {{ .Values.config.bindHost | quote }}
    ca_common_name = {{ .Values.config.caCommonName | quote }}
    server_common_name = {{ .Values.config.serverCommonName | quote }}
    cert_validity_days = {{ .Values.config.certValidityDays }}
    enrollment_port = {{ .Values.service.ports.enrollment }}
    marti_api_port = {{ .Values.service.ports.martiApi }}
    plain_tcp_port = {{ .Values.service.ports.plainTcp }}
    mtls_port = {{ .Values.service.ports.mtls }}
    plain_tcp_enabled = {{ .Values.config.plainTcpEnabled }}
    server_names = [{{ range $i, $name := .Values.config.serverNames }}{{ if $i }}, {{ end }}{{ $name | quote }}{{ end }}]
    trusted_proxies = [{{ range $i, $proxy := .Values.config.trustedProxies }}{{ if $i }}, {{ end }}{{ $proxy | quote }}{{ end }}]
    proxy_protocol_from = [{{ range $i, $proxy := .Values.config.proxyProtocolFrom }}{{ if $i }}, {{ end }}{{ $proxy | quote }}{{ end }}]
    admin_common_name = {{ .Values.config.adminCommonName | quote }}
    enrollment_mode = {{ .Values.config.enrollmentMode | quote }}
    max_upload_mb = {{ .Values.config.maxUploadMb }}
    max_connections = {{ .Values.config.limits.maxConnections }}
    max_connections_per_ip = {{ .Values.config.limits.maxConnectionsPerIp }}
    handshake_timeout_seconds = {{ .Values.config.limits.handshakeTimeoutSeconds }}
    http_header_timeout_seconds = {{ .Values.config.limits.httpHeaderTimeoutSeconds }}
    {{- if .Values.metrics.enabled }}
    metrics_port = {{ .Values.metrics.port }}
    {{- end }}
    {{- if .Values.enrollmentCert.existingSecret }}
    enrollment_cert_file = "/etc/microtak/enrollment-tls/tls.crt"
    enrollment_key_file = "/etc/microtak/enrollment-tls/tls.key"
    {{- end }}
    # Fixed to the mounted volumes -- see values.yaml's `config` comment.
    data_dir = "/var/lib/microtak-server/data"
    backup_dir = "/var/lib/microtak-server/backup"
    backup_enabled = {{ .Values.config.backup.enabled }}
    backup_interval_seconds = {{ .Values.config.backup.intervalSeconds }}
    backup_offsite_command = [{{ range $i, $part := .Values.config.backup.offsiteCommand }}{{ if $i }}, {{ end }}{{ $part | quote }}{{ end }}]
