# Optional overlay: front the enrollment endpoint with an existing Traefik
# reverse proxy that holds a real, publicly-trusted certificate (e.g. Let's
# Encrypt) for MICROTAK_DOMAIN.
#
# Usage:
#   cp .env.example .env   # fill in the real values -- .env is gitignored,
#                           # never commit it (see .env.example's own notes)
#   docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d
#
# This assumes a Traefik instance *already running elsewhere* on the same
# Docker host (its own compose/stack, not part of this repo), attached to an
# external Docker network, with a certificate resolver already configured.
# This file only adds this container to that network and labels it --
# it does not run Traefik itself.
#
# **No plaintext hop**: MicroTAK's enrollment port is HTTPS only, so Traefik
# re-encrypts to it (`scheme=https`) and verifies MicroTAK's own CA through
# a serversTransport -- which Traefik only accepts from its *file* provider,
# not from Docker labels. Add docs/proxy/traefik-microtak-transport.yml to
# Traefik's dynamic file configuration and mount MicroTAK's CA certificate
# (data volume, `ca-cert.pem`) where that file points. See
# docs/proxy/README.md.
#
# Also set `trusted_proxies` in microtak.toml to Traefik's address on the
# proxy network, so rate limiting sees real client addresses instead of
# Traefik's.
#
# Deliberately NOT routed here: the Marti API (8443) and the mTLS CoT relay
# (8089). They authenticate clients by certificate at the TLS layer, so a
# proxy terminating TLS in front of them would break client-cert auth; they
# stay published directly (or via plain TCP passthrough) -- see
# docs/proxy/README.md.
services:
  microtak-server:
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.microtak-enroll.rule=Host(`${MICROTAK_DOMAIN}`)"
      - "traefik.http.routers.microtak-enroll.entrypoints=${TRAEFIK_ENROLLMENT_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.microtak-enroll.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.microtak-enroll.service=microtak-enroll"
      - "traefik.http.services.microtak-enroll.loadbalancer.server.port=8446"
      - "traefik.http.services.microtak-enroll.loadbalancer.server.scheme=https"
      - "traefik.http.services.microtak-enroll.loadbalancer.serverstransport=${TRAEFIK_MICROTAK_TRANSPORT:-microtak@file}"

networks:
  proxy:
    name: ${TRAEFIK_NETWORK:-web}
    external: true
