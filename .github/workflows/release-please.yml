name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  # A release created by release-please's own GITHUB_TOKEN doesn't fire a
  # `release: published` event for other workflows to react to (GitHub
  # suppresses events triggered by GITHUB_TOKEN-authenticated actions, to
  # avoid infinite loops) -- so the Docker publish has to be chained
  # directly here instead of relying on that event. See docker-publish.yml.
  docker-publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/docker-publish.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
    permissions:
      contents: read
      packages: write
