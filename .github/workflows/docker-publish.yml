name: Publish Docker image

# Fires only when release-please actually cuts a GitHub Release (i.e. a
# release PR was merged) -- not on every push to main. See
# release-please.yml for how the release/tag gets created in the first
# place from Angular-format commit messages.
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # From a tag like "v1.2.3" this produces ghcr.io/<owner>/<repo>
      # tagged :1.2.3, :1.2, :1, and :latest -- the usual OCI/semver
      # convention. Non-tag/non-semver events (there aren't any here,
      # since this workflow only runs on a published release) would be
      # skipped by these rules, so there's nothing to prune.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}},value=${{ github.event.release.tag_name }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry-backed layer cache -- reuses the Rust dependency-build
          # layer across releases so an unrelated one-line doc change
          # doesn't force a full ~25s dependency recompile from scratch.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max
