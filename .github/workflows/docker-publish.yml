name: Publish Docker image

# NOTE: `release: types: [published]` deliberately kept as a manual-release
# fallback, but it will NOT fire for releases release-please itself creates
# -- GitHub doesn't dispatch events for actions taken by GITHUB_TOKEN, to
# avoid infinite trigger loops. The real trigger for the normal case is
# release-please.yml calling this workflow directly via workflow_call once
# it confirms a release was actually cut (see that file's `outputs`).
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.event.release.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # release-please-config.json sets include-component-in-tag: false, so
      # tags are plain "vX.Y.Z" (not "microtak-server-vX.Y.Z") -- required
      # for docker/metadata-action's semver pattern matching below to parse
      # them at all. From "v1.2.3" this produces ghcr.io/<owner>/<repo>
      # tagged :1.2.3, :1.2, :1, and :latest.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag_name || github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag_name || github.event.release.tag_name }}
            type=semver,pattern={{major}},value=${{ inputs.tag_name || github.event.release.tag_name }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry-backed layer cache -- reuses the Rust dependency-build
          # layer across releases so an unrelated one-line doc change
          # doesn't force a full ~25s dependency recompile from scratch.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max
