name: Publish release binaries

# Releases here are immutable (org setting): assets can only be attached
# *before* a release is published. So release-please creates the release as
# a **draft** (release-please-config.json: "draft" + "force-tag-creation",
# the latter so the tag exists immediately and the next release PR still
# finds this release), this workflow builds and uploads the binaries to the
# draft, and only then publishes it. A failed build leaves an unpublished
# draft -- never a published release without binaries.
#
# Chained from release-please.yml via workflow_call (a release created with
# the workflow's own GITHUB_TOKEN doesn't fire release events). Can also be
# run by hand for a draft release that's still waiting for its binaries.
on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: Tag of the draft release to build, upload to, and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    # The glibc targets build natively on their own runner. 32-bit ARM
    # (Raspberry Pi 2, and any Pi on 32-bit Raspberry Pi OS) has no GitHub
    # runner, so it's cross-built with `cross` as a static musl binary --
    # no glibc version to match on the target.
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: armv7-unknown-linux-musleabihf
            runner: ubuntu-latest
            cross: true
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ inputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ARCHIVE: microtakd-${{ matrix.target }}.tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        if: ${{ !matrix.cross }}
        run: |
          cargo build --release --locked --bin microtakd
          echo "BIN_DIR=target/release" >> "$GITHUB_ENV"

      - name: Build (cross)
        if: matrix.cross
        run: |
          cross build --release --locked --target ${{ matrix.target }} --bin microtakd
          echo "BIN_DIR=target/${{ matrix.target }}/release" >> "$GITHUB_ENV"

      # The .sha256 sits next to the archive so packaging/install.sh can
      # verify the download before swapping the binary in.
      - name: Package
        run: |
          tar czf "$ARCHIVE" -C "$BIN_DIR" microtakd
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      # `gh` finds draft releases by tag (the REST "get release by tag"
      # endpoint, which some upload actions rely on, doesn't return drafts).
      - name: Upload to the draft release
        run: gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Publish the release
        run: gh release edit "${{ inputs.tag_name }}" --draft=false --latest
