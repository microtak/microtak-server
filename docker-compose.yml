services:
  microtak-server:
    build: .
    image: microtak-server:latest
    restart: unless-stopped
    ports:
      # host:container -- enrollment, Marti API (mTLS), plain-TCP CoT, mTLS CoT.
      - "8446:8446"
      - "8443:8443"
      - "8087:8087"
      - "8089:8089"
    volumes:
      - microtak-data:/var/lib/microtak-server/data
      - microtak-backup:/var/lib/microtak-server/backup
      # Uncomment to override defaults with your own microtak.toml (see
      # README.md "Building and running" for the available fields):
      # - ./microtak.toml:/etc/microtak/microtak.toml:ro

volumes:
  microtak-data:
  microtak-backup:
